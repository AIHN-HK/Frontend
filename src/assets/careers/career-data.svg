<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DCE4FE"/>
    </linearGradient>
    <linearGradient id="chartBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55B3D9"/>
      <stop offset="100%" stop-color="#028F94"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bgData)"/>
  <!-- Analytics card plate -->
  <rect x="22" y="24" width="76" height="72" rx="14" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(79,70,229,0.08))"/>
  <!-- Bar chart columns -->
