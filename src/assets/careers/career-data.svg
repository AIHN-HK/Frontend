  <rect x="62" y="38" width="10" height="46" rx="3" fill="url(#chartBar1)"/>
  <rect x="76" y="54" width="10" height="30" rx="3" fill="#93C5FD"/>
  <!-- Connecting trend line with dots -->
  <path d="M39 58 L53 44 L67 34 L81 50" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="39" cy="58" r="3" fill="#F59E0B"/>
  <circle cx="53" cy="44" r="3" fill="#F59E0B"/>
  <circle cx="67" cy="34" r="3.5" fill="#EF4444"/>
