<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="companionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF8F9"/>
      <stop offset="100%" stop-color="#D7F1F0"/>
    </linearGradient>

    <!-- Core Sphere / Emblem Gradient -->
    <linearGradient id="orbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#028F94"/>
      <stop offset="60%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55B3D9"/>
      <stop offset="100%" stop-color="#88E8F2"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="companionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Container Ring -->
  <rect width="120" height="120" rx="32" fill="url(#companionBg)" stroke="#C8EBE8" stroke-width="1.5"/>

  <!-- Concentric Insight Wave Rings -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#028F94" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#55B3D9" stroke-width="1" opacity="0.45"/>

  <!-- Central Companion Node Orb -->
  <circle cx="60" cy="60" r="28" fill="url(#orbGradient)" filter="url(#companionGlow)"/>

  <!-- Inner Digital Lens / Reflection Arc -->
  <path d="M42 50a22 22 0 0 1 36 0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Intelligent Core Aperture / Friendly Digital Focus Wave -->
  <!-- Clean horizontal stylized insight aperture -->
  <rect x="46" y="55" width="28" height="10" rx="5" fill="#0C1E2C" opacity="0.9"/>
  <!-- Dual Intelligent Soft Cyan Glimmer Points -->
  <circle cx="53" cy="60" r="2.5" fill="#88E8F2"/>
  <circle cx="67" cy="60" r="2.5" fill="#88E8F2"/>
  <!-- Connecting Digital Wave Arc -->
  <path d="M57 60h6" stroke="#55B3D9" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass Star Sparkles (Symbol of Career Guidance & Insight) -->
  <!-- Top Right Sparkle -->
  <path d="M88 28l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z" fill="#028F94"/>
  <!-- Top Right Mini Core -->
  <circle cx="88" cy="35.5" r="1.2" fill="#FFFFFF"/>

  <!-- Bottom Left Subtle Sparkle -->
  <path d="M30 84l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#F59E0B" opacity="0.85"/>

  <!-- Subtle Career Direction Arrow Ring Marker (6-point alignment marker) -->
  <circle cx="60" cy="22" r="2.5" fill="#028F94"/>
</svg>
